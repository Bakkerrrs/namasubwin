<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src 'self' https://api.openai.com wss://api.openai.com; img-src 'self' data:; style-src 'self'; media-src 'self' blob:;" />
  <title>NamaSub — subtítulos JP→ES en vivo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="layout">
    <!-- ================= Panel lateral (config) ================= -->
    <aside id="panel">
      <h1>NamaSub <span class="tag">JP→ES</span></h1>

      <section>
        <h2>Fuente de video</h2>
        <div class="row">
          <button id="btn-refresh-sources" class="small">↻ Actualizar fuentes</button>
        </div>
        <div id="source-grid" class="source-grid"></div>
        <label class="field">
          <span>Cámara / capturadora</span>
          <select id="camera-select">
            <option value="">— usar pantalla/ventana seleccionada —</option>
          </select>
        </label>
      </section>

      <section>
        <h2>Fuente de audio</h2>
        <label class="field">
          <span>Origen a transliterar</span>
          <select id="audio-select">
            <option value="system">Audio del sistema (loopback)</option>
          </select>
        </label>
        <label class="field">
          <span>Salida del reproductor (audio diferido)</span>
          <select id="output-select">
            <option value="default">Salida por defecto del sistema</option>
          </select>
        </label>
        <p class="hint left">Con loopback, elige aquí una salida <b>distinta</b>
          (auriculares, HDMI…) para que la app no capture su propio audio.</p>
      </section>

      <section>
        <h2>OpenAI</h2>
        <label class="field">
          <span>API Key</span>
          <div class="row">
            <input id="api-key" type="password" placeholder="sk-..." autocomplete="off" />
            <button id="btn-show-key" class="small" title="Mostrar/ocultar">👁</button>
          </div>
        </label>
        <label class="field">
          <span>Modelo Realtime</span>
          <select id="model-select"></select>
        </label>
      </section>

      <section>
        <h2>Diferido y VAD</h2>
        <label class="field">
          <span>Atraso del video: <b id="delay-label">10 s</b></span>
          <input id="delay" type="range" min="5" max="25" step="1" value="10" />
        </label>
        <details>
          <summary>Segmentación (VAD)</summary>
          <label class="field">
            <span>Umbral: <b id="vad-threshold-label">0.5</b></span>
            <input id="vad-threshold" type="range" min="0.1" max="0.9" step="0.05" value="0.5" />
          </label>
          <label class="field">
            <span>Prefijo (ms): <b id="vad-prefix-label">200</b></span>
            <input id="vad-prefix" type="range" min="0" max="500" step="50" value="200" />
          </label>
          <label class="field">
            <span>Silencio de corte (ms): <b id="vad-silence-label">250</b></span>
            <input id="vad-silence" type="range" min="100" max="1000" step="50" value="250" />
          </label>
        </details>
      </section>

      <section>
        <h2>Subtítulos</h2>
        <label class="check">
          <input id="bilingual" type="checkbox" />
          <span>Mostrar también el japonés</span>
        </label>
        <label class="check">
          <input id="record-file" type="checkbox" />
          <span>Guardar la sesión en un archivo</span>
        </label>
        <button id="btn-export-srt" class="small" disabled>Exportar SRT…</button>
      </section>

      <button id="btn-toggle" class="primary">▶ Iniciar</button>
      <p id="status" class="status">Detenido</p>
      <p class="hint">Alt+Enter / F11: pantalla completa</p>
    </aside>

    <!-- ================= Zona de video ================= -->
    <section id="stage">
      <div id="video-wrap">
        <video id="player" playsinline></video>
        <!-- Capa de imagen con los subtítulos, encima de la capa de video -->
        <div id="subtitle-layer">
          <div id="sub-jp" class="sub-line jp"></div>
          <div id="sub-es" class="sub-line es"></div>
        </div>
        <div id="stage-hint">Elige una fuente y pulsa <b>Iniciar</b></div>
        <div id="buffer-badge" class="hidden"></div>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
